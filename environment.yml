name: alphaearth
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python=3.12.11

  # Jupyter and notebook tools
  - jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - notebook

  # Deep Learning Frameworks
  - pytorch
  - pytorch-cuda=12.1  # Adjust CUDA version if needed, or remove for CPU-only
  - torchvision
  - torchaudio
  - tensorflow
  - keras

  # Scientific Computing
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - plotly

  # Geospatial Libraries
  - geopandas
  - rasterio
  - rioxarray
  - xarray
  - shapely
  - fiona
  - gdal
  - pyproj
  - folium
  - contextily

  # Earth Observation Specific
  - earthengine-api
  - geemap
  - satpy
  - sentinelsat

  # Additional useful packages
  - dask
  - netcdf4
  - h5py
  - zarr
  - bottleneck
  - numba

  # Development tools
  - black
  - flake8
  - pytest

  # Pip packages (if any conda packages don't work)
  - pip
  - pip:
    - pygis  # Optional: installs geemap with all dependencies
